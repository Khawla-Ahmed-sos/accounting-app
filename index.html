<script>
    // --- كود البحث المتقدم وتجاوز التخزين المؤقت (Cache) ---
    (function() {
        const cacheBuster = "?v=" + new Date().getTime();
        
        // دالة البحث السريع وتصفية النتائج في المنظومة
        window.AppSearchAndRefresh = function(searchInputId, tableId) {
            const input = document.getElementById(searchInputId);
            if (!input) return;
            
            const filter = input.value.toLowerCase().trim();
            const table = document.getElementById(tableId);
            if (!table) return;
            
            const rows = table.getElementsByTagName("tr");
            
            for (let i = 1; i < rows.length; i++) {
                let rowText = rows.content || rows[i].innerText;
                if (rowText.toLowerCase().indexOf(filter) > -1) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        };

        // دالة مسح الكاش وتحديث الصفحة بأحدث بيانات
        window.ForceSystemRefresh = function() {
            window.location.reload(true);
        };
        
        console.log("تم تحميل وتحديث أكواد المنظومة بنجاح.");
    })();
</script>
